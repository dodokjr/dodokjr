<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Muhammad Fikri Ardiyansah — Full-Stack Software Engineer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="0.55" stop-color="#e0709a"/>
      <stop offset="1" stop-color="#3fb4e8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e0709a"/>
      <stop offset="1" stop-color="#3fb4e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4fd6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5b4fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6457e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d6457e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b8fc9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b8fc9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#14141c"/>

    <!-- aurora (meniru kelas .aurora di Nusa CSS) -->
    <ellipse cx="230" cy="90" rx="380" ry="230" fill="url(#a1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 30; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="60" rx="340" ry="200" fill="url(#a2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 40; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="330" rx="420" ry="200" fill="url(#a3)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 50 -30; 0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- kartu kaca -->
    <rect x="40" y="40" width="1120" height="240" rx="20" fill="#1c1c27" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.14"/>

    <!-- badge ala .badge-dot -->
    <g transform="translate(84 78)">
      <rect width="196" height="30" rx="15" fill="#8b7cf6" fill-opacity="0.16"/>
      <circle cx="18" cy="15" r="4.5" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#b9b0ff">Open to collaborate</text>
    </g>

    <text x="84" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.8" fill="url(#brand)">Muhammad Fikri Ardiyansah</text>

    <text x="86" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#c9c9d6">Full-Stack Software Engineer · TypeScript Enthusiast</text>

    <rect x="86" y="236" width="360" height="3" rx="1.5" fill="url(#line)"/>

    <text x="86" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8e8ea3">JavaScript · TypeScript · Go  —  Indonesia 🇮🇩</text>

    <!-- ornamen kode kanan -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill-opacity="0.9">
      <text x="900" y="100" fill="#8b7cf6">const <tspan fill="#e0709a">dev</tspan> <tspan fill="#c9c9d6">=</tspan> {</text>
      <text x="920" y="126" fill="#c9c9d6">name: <tspan fill="#3fb4e8">"Fikri"</tspan>,</text>
      <text x="920" y="152" fill="#c9c9d6">stack: [<tspan fill="#3fb4e8">"TS"</tspan>, <tspan fill="#3fb4e8">"Go"</tspan>],</text>
      <text x="920" y="178" fill="#c9c9d6">coffee: <tspan fill="#4ade80">true</tspan>,</text>
      <text x="900" y="204" fill="#8b7cf6">};<tspan fill="#e0709a">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> ▍</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
